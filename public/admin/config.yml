# ============================================================
# Sovrin Group content manager configuration (Sveltia CMS)
#
# Saved content is committed straight to the GitHub repo below.
#
# For local editing, open /admin/index.html on the dev server in
# Chrome or Edge and choose "Work with Local Repository" - Sveltia
# reads and writes the files directly via the File System Access
# API. It does not use decap-server, and ignores local_backend.
# ============================================================

backend:
  name: github
  repo: Sovrin-Group/sovrin-group
  branch: main

# Uploaded PDFs are stored here in the project…
media_folder: "public/whitepapers"
# …and served from this URL path on the live site.
public_folder: "/whitepapers"

site_url: https://sovringroup.com
logo_url: /images/logo.png

collections:
  - name: "whitepapers"
    label: "White Papers"
    label_singular: "White Paper"
    folder: "src/content/whitepapers"
    create: true
    delete: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title", "category"]
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The white paper's full title as it should appear on the site." }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Unified Architecture"
          - "Governed Identity"
          - "Other Research"
        hint: "Which section of the White Papers page this appears under."
      - { label: "Summary", name: "summary", widget: "text", hint: "One or two sentences shown on the card." }
      - { label: "Publication Date", name: "date", widget: "datetime", time_format: false, format: "YYYY-MM-DD" }
      - { label: "PDF File", name: "pdf", widget: "file", hint: "Upload the white paper PDF here." }
      - { label: "Notes (optional, not shown on site)", name: "body", widget: "markdown", required: false }
